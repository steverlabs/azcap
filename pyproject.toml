[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azcap"
version = "0.2.0"
description = "Azure VM SKU restriction scanner — % of SKUs restricted per region, family, zone, and paired region"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Steve Ross" }]
keywords = ["azure", "capacity", "vm", "sku", "availability-zones", "region-pairs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "azure-identity>=1.17",
  "azure-mgmt-compute>=30",
  "azure-mgmt-resource-subscriptions>=1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/steverlabs/azcap"
Issues = "https://github.com/steverlabs/azcap/issues"

[project.scripts]
azcap = "azcap:main"

[tool.setuptools]
packages = ["azcap"]

[tool.setuptools.package-data]
azcap = ["report_template.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
